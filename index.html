(function matrixRain() {
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let cols, drops;
  const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789ABCDEF$#@%&*';

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 14);
    drops = Array(cols).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff88';
    ctx.font = '14px monospace';
    for (let i = 0; i < drops.length; i++) {
      const t = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(t, i * 14, drops[i] * 14);
      if (drops[i] * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 55);
})();

/* =========================================================
   2. AUDIO (WebAudio — tanpa file eksternal)
   ========================================================= */
const AudioEngine = (() => {
  let ctx = null;
  let enabled = true;

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { enabled = false; }
  }

  function beep(freq = 440, dur = 0.05, type = 'square', vol = 0.04) {
    if (!enabled || !ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.stop(ctx.currentTime + dur);
  }

  return {
    init,
    toggle() { enabled = !enabled; return enabled; },
    isEnabled() { return enabled; },
    key()   { beep(880 + Math.random()*200, 0.02, 'square', 0.02); },
    alert() { beep(220, 0.15, 'sawtooth', 0.06); setTimeout(()=>beep(180,0.15,'sawtooth',0.06), 160); },
    ok()    { beep(660, 0.08, 'sine', 0.05); setTimeout(()=>beep(990,0.12,'sine',0.05), 90); },
    error() { beep(140, 0.2, 'sawtooth', 0.07); },

  };
})();

function typeOut(lines, delay = 55, done) {
  input.disabled = true;
  let i = 0;
  const step = () => {
    if (i >= lines.length) {
      input.disabled = false;
      input.focus();
      if (done) done();
      return;
    }
    let item = lines[i++];
    let text, cls;
    if (Array.isArray(item)) { text = item[0]; cls = item[1] || ''; }
    else { text = item; cls = ''; }
    print(text, cls);

    // Sound kecil setiap baris
    if (text && cls !== 'sys') AudioEngine.key();

    const pause = text === '' ? 120 : delay + Math.random() * 30;
    setTimeout(step, pause);
  };
  step();
}

input.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const raw = this.value.trim();
  if (!raw) return;

  AudioEngine.init();
  AudioEngine.key();

  printCmd(raw);
  this.value = '';

  const norm = raw.toLowerCase().replace(/\s+/g, ' ');
  const first = norm.split(' ')[0];

  if (COMMANDS[first]) {
    COMMANDS[first](norm);
    return;
  }

  checkMissionCommand(norm);
});

function checkMissionCommand(norm) {
  const m = state.mission;

  if (m === 1 && norm === 'nmap -v iron-vault.vcorp.com') {
    runMissionSuccess(1, () => { state.flags.scanned = true; });
    return;
  }
  if (m === 2 && norm === 'python hvac_exploit.py --target 8080') {
    runMissionSuccess(2, () => { state.flags.exploited = true; });
    return;
  }
  if (m === 3 && norm === 'set-temp --room-all 60c') {
    runMissionSuccess(3, () => { state.flags.burned = true; });
    return;
  }
  if (m === 4 && norm === 'rm -rf /var/log') {
    runMissionSuccess(4, () => {
      state.flags.cleaned = true;
      state.mission = 5;
    });
    return;
  }

  if (m > 4) {
    AudioEngine.error();
    print(`Simulasi selesai. Ketik "restart" untuk mengulang.`, 'err');
  } else if (looksLikeMissionCmd(norm)) {
    AudioEngine.error();
    print(`[!] Perintah itu belum waktunya. Fokus ke Misi ${m}.`, 'warn');
    print(`    Ketik "help" untuk melihat perintah.`, 'dim');
  } else {
    AudioEngine.error();
    print(`'${norm.split(' ')[0]}' bukan perintah yang dikenal. Ketik "help".`, 'err');
  }
}

function looksLikeMissionCmd(norm) {
  return norm.startsWith('nmap') ||
         norm.startsWith('python') ||
         norm.startsWith('set-temp') ||
         norm.startsWith('rm ');
}

    } else {

  });

    print(`[SYSTEM] Kamu berada di Misi ${state.mission}.`, 'sys');
    setTimeout(() => typeOut(MISSION_INTRO[state.mission], 55), 500);
  }
});
</script>
