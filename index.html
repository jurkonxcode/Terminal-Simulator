<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Terminal Simulator // nullSociety</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>

  <div class="terminal">
    <header class="header">
      <span class="header-title">▌ nullSociety // secure_channel</span>
      <button id="soundBtn" class="sound-btn" type="button" aria-label="Toggle sound">🔊</button>
    </header>

    <main id="output" class="output" aria-live="polite" role="log"></main>

    <form id="inputForm" class="input-area" autocomplete="off">
      <span class="prompt" id="prompt">v01d@nullSociety:~$</span>
      <input
        type="text"
        id="cmd"
        class="cmd-input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
      >
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
